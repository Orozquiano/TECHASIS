<nav class="navbar" aria-label="Navegación principal">
  <div class="navbar_items" #navTrack>
    <span #navPill class="navbar_pill" aria-hidden="true"></span>
    @for (item of visibleNavItems(); track item.route) {
      <a
        class="navbar_link"
        [routerLink]="['/' + item.route]"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
      >
        {{ item.label }}
      </a>
    }
  </div>

  <app-menu-hamburguesa />
</nav>

<nav class="tabbar" aria-label="Secciones" [class.is-hidden]="pageOverlayOpen()" #tabTrack>
  <span #tabPill class="tabbar_pill" aria-hidden="true"></span>
  @for (item of tabItems(); track item.route) {
    <a
      class="tabbar_item"
      [routerLink]="['/' + item.route]"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
    >
      <ng-container *ngTemplateOutlet="navSymbol; context: { $implicit: item.symbol }" />
      <span class="tabbar_label">{{ item.tabLabel }}</span>
    </a>
  }

  @if (overflowItems().length) {
    <button
      class="tabbar_item"
      type="button"
      [class.is-active]="moreActive()"
      [attr.aria-expanded]="moreOpen()"
      aria-controls="navbar-more"
      (click)="toggleMore()"
    >
      <ng-container *ngTemplateOutlet="navSymbol; context: { $implicit: 'more' }" />
      <span class="tabbar_label">Más</span>
    </button>
  }
</nav>

@if (moreOpen()) {
  <button class="sheet_backdrop" type="button" aria-label="Cerrar secciones" (click)="closeMore()"></button>
  <div
    class="sheet"
    id="navbar-more"
    role="dialog"
    aria-modal="true"
    aria-label="Más secciones"
    [class.is-dragging]="sheetDragging()"
    [style.transform]="'translateY(' + sheetOffset() + 'px)'"
  >
    <button
      class="sheet_handle"
      type="button"
      aria-label="Desliza hacia abajo para cerrar"
      (pointerdown)="onSheetPointerDown($event)"
    >
      <span class="sheet_grabber" aria-hidden="true"></span>
    </button>
    @for (item of overflowItems(); track item.route) {
      <a
        class="sheet_link"
        [routerLink]="['/' + item.route]"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
      >
        <ng-container *ngTemplateOutlet="navSymbol; context: { $implicit: item.symbol }" />
        {{ item.label }}
      </a>
    }
  </div>
}

<ng-template #navSymbol let-symbol>
  <svg class="nav_symbol" viewBox="0 0 24 24" aria-hidden="true">
    @switch (symbol) {
      @case ('plus') {
        <path d="M12 5.5v13M5.5 12h13" />
      }
      @case ('list') {
        <path d="M9 7h10M9 12h10M9 17h10" />
        <circle cx="5.2" cy="7" r="1" />
        <circle cx="5.2" cy="12" r="1" />
        <circle cx="5.2" cy="17" r="1" />
      }
      @case ('folder') {
        <path d="M4 8.2V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6.2a2 2 0 0 0-2-2h-6.2L10.2 6H6a2 2 0 0 0-2 2.2Z" />
      }
      @case ('check') {
        <path d="M5 12.5 9.2 17 19 7" />
      }
      @case ('chart') {
        <path d="M5 19V10M12 19V5M19 19v-7" />
      }
      @case ('trend') {
        <path d="M4.5 16.5 9 11l3.2 3.2L19.5 6.5" />
        <path d="M14.5 6.5h5v5" />
      }
      @case ('shield') {
        <path d="M12 3.8 18.5 6.6v4.8c0 3.9-2.6 6.7-6.5 8.2-3.9-1.5-6.5-4.3-6.5-8.2V6.6L12 3.8Z" />
      }
      @case ('sliders') {
        <path d="M4 8h16M4 16h16" />
        <circle cx="9" cy="8" r="2.1" />
        <circle cx="15" cy="16" r="2.1" />
      }
      @case ('more') {
        <circle cx="6" cy="12" r="1.35" />
        <circle cx="12" cy="12" r="1.35" />
        <circle cx="18" cy="12" r="1.35" />
      }
    }
  </svg>
</ng-template>
