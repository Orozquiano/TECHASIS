<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
  <div class="form-group">
    <label for="br-aseg">Aseguradora *</label>
    <app-select
      inputId="br-aseg"
      formControlName="aseguradoraId"
      placeholder="— Selecciona —"
      [options]="insurerOptions"
    ></app-select>
  </div>
  <div class="form-group">
    <label for="br-desc">Descripción *</label>
    <input id="br-desc" type="text" formControlName="descripcion" />
  </div>
  <div class="form-group">
    <label for="br-valor">Valor *</label>
    <input id="br-valor" type="number" min="0" formControlName="valor" />
  </div>
  <div class="form-group">
    <label for="br-codigo">Código *</label>
    <input id="br-codigo" type="text" formControlName="codigo" />
  </div>
  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="cancel.emit()" [disabled]="pending">Cancelar</button>
    <button type="submit" class="btn-primary" [disabled]="pending">{{ rateId ? 'Actualizar' : 'Guardar' }}</button>
  </div>
</form>
