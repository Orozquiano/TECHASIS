name: Deploy GitHub Pages

on:
  push:
    branches:
      - integracion_techasis_1V
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npx ng build --configuration github-pages

      - name: Prepare SPA fallback
        run: |
          cp dist/techasis/browser/index.html dist/techasis/browser/404.html
          touch dist/techasis/browser/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/techasis/browser
          publish_branch: gh-pages
          force_orphan: true
